<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F5F3EE; --card:#FFFFFF; --ink:#1C1B19; --ink-soft:#5A574D; --line:#DAD4C6;
    --accent:#6E2A3B; --accent-tint:#F1E4E7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;}
  .nav{font-size:13px;margin-bottom:10px;}
  .nav a{color:var(--ink-soft);}
  h1{font-family:Georgia,serif;font-size:26px;margin:0 0 4px;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}
  .meta-line{font-size:13px;color:var(--ink-soft);margin:14px 0 14px;padding-top:14px;border-top:1px solid var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
  .card-top{display:flex;justify-content:space-between;gap:10px;}
  .place{font-family:Georgia,serif;font-size:17px;margin:0 0 2px;}
  .price{font-family:Georgia,serif;font-size:19px;font-weight:bold;white-space:nowrap;color:var(--accent);}
  .facts{font-size:13.5px;color:var(--ink-soft);margin:10px 0 0;}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:12px;font-size:12px;}
  .view-link{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;}
  .empty, .loading{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px;line-height:1.6;}
  footer{margin-top:22px;font-size:12px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="nav"><a href="index.html">← Rentals</a></p>
  <header>
    <h1>For Sale</h1>
    <p class="sub">Houses, condos, and co-ops in a handful of Queens/Astoria/Brooklyn neighborhoods.</p>
  </header>

  <div class="meta-line" id="countLine"></div>

  <div id="loadingState" class="loading">Loading listings…</div>
  <div id="cardList"></div>
  <div class="empty" id="emptyState" style="display:none;"></div>

  <footer>
    Refreshed on demand (no fixed schedule). Sourced from Redfin — not affiliated.
  </footer>
</div>

<script src="config.js"></script>
<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtPrice(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

async function loadListings(){
  const { data, error } = await supabaseClient
    .from('housing_listings')
    .select('*')
    .eq('active', true)
    .order('price', { ascending: true });
  if(error){
    document.getElementById('loadingState').textContent = 'Could not load listings: ' + error.message;
    return;
  }
  document.getElementById('loadingState').style.display = 'none';
  render(data);
}

function render(listings){
  document.getElementById('countLine').textContent = listings.length + (listings.length===1 ? ' listing' : ' listings');
  const list = document.getElementById('cardList');
  const empty = document.getElementById('emptyState');

  if(listings.length===0){
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = "Nothing found right now.";
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = listings.map(l=>{
    const factsParts = [];
    if(l.beds != null) factsParts.push((l.beds===0 ? 'Studio' : l.beds + ' bd'));
    if(l.baths != null) factsParts.push(l.baths + ' ba');
    if(l.sqft) factsParts.push(l.sqft + ' ft²');
    return `
      <div class="card">
        <div class="card-top">
          <p class="place">${l.address}</p>
          <div class="price">${fmtPrice(l.price)}</div>
        </div>
        <div class="facts">${factsParts.join(' · ')}</div>
        <div class="card-bottom">
          <span></span>
          <a class="view-link" href="${l.source_url}" target="_blank">View on Redfin</a>
        </div>
      </div>
    `;
  }).join('');
}

loadListings();
</script>
</body>
</html>
