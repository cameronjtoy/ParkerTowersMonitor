name: apartment-monitor

on:
  schedule:
    # UTC 10:00-14:59 covers 6:00-9:59am America/New_York across both EDT (UTC-4)
    # and EST (UTC-5); monitor.py's own local-time gate filters the DST-mismatched edges.
    - cron: '*/15 10-14 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass the 6-10am active window (for manual testing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python3 monitor.py
