name: apartment-monitor

on:
  schedule:
    # UTC 10:00-14:59 covers 6:00-9:59am America/New_York across both EDT (UTC-4)
    # and EST (UTC-5); monitor.py's own local-time gate filters the DST-mismatched edges.
    - cron: '*/15 10-14 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass the 6-10am active window (for manual testing)'
        type: boolean
        default: false
      threshold_override:
        description: 'Override price threshold for this run (for manual testing)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          PRICE_THRESHOLD: ${{ github.event.inputs.threshold_override != '' && github.event.inputs.threshold_override || '2200' }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python3 monitor.py

      - name: Persist notification state
        run: |
          if ! git diff --quiet -- seen_units.json; then
            git config user.name "apartment-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add seen_units.json
            git commit -m "update seen units"
            git push
          fi
