name: apartment-monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          PRICE_THRESHOLD: '2200'
        run: python3 monitor.py

      - name: Persist notification state
        run: |
          if ! git diff --quiet -- seen_units.json; then
            git config user.name "apartment-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add seen_units.json
            git commit -m "update seen units"
            git push
          fi
